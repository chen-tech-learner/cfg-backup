name: check-py-syntax
on:
  push:
    paths:
      - 'py/**.py'
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库全部代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 检测并删除语法错误py
        run: |
          for f in py/*.py; do
            if ! python3 -m py_compile "$f"; then
              echo "❌删除损坏文件: $f"
              rm -f "$f"
            fi
          done

      - name: 提交变更回仓库
        run: |
          git config --global user.name auto‑robot
          git config --global user.email robot@example.com
          git add .
          git commit -m "auto remove bad py files" || true
          git push
