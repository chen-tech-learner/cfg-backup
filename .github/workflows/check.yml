name: check-py-syntax
on:
  push:
    paths:
      - 'py/**.py'
  schedule:
    - cron: '0 0 1,16 * *'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库全部代码
        uses: actions/checkout@v4

      - name: Python语法校验，自动删除语法损坏py
        run: |
          for f in py/*.py; do
            if ! python3 -m py_compile "$f"; then
              echo "❌发现语法错误，自动删除：$f"
              git rm "$f"
            fi
          done

          git config --global user.name auto‑robot
          git config --global user.email robot@example.com
          git commit -m "定时/推送：自动移除语法损坏py" || true
          git push
