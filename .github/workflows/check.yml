name: check-py-syntax
on:
  push:
    paths:
      - 'py/**.py'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: Python语法校验，删除语法损坏py
        run: |
          for f in py/*.py; do
            if ! python3 -m py_compile "$f"; then
              echo "删除语法错误文件：$f"
              git rm "$f"
            fi
          done

          git config --global user.name auto‑robot
          git config --global user.email robot@example.com
          git commit -m "自动移除语法损坏py" || true
          git push
