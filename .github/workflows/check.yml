name: check-py-syntax
on:
  push:
    paths:
      - 'py/**.py'
  # 每月 1号、16号 UTC时间0点执行（对应国内早上8点左右）
  schedule:
    - cron: '0 0 1,16 * *'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库全部代码
        uses: actions/checkout@v4

      - name: Python语法校验，删除语法损坏py
        run: |
          for f in py/*.py; do
            if ! python3 -m py_compile "$f"; then
              echo "删除语法错误文件：$f"
              git rm "$f"
            fi
          done

          git config --global user.name auto‑robot
          git config --global user.email robot@example.com
          git commit -m "定时任务：自动移除语法损坏py" || true
          git push
